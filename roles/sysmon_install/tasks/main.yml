---
# roles/sysmon_install/tasks/main.yml
# Installs Sysmon 64-bit and applies the sysmon-modular config.
# Idempotent: re-running updates the config if changed, skips download
# if Sysmon is already installed at the expected path.

- name: Check if Sysmon is already installed
  ansible.windows.win_service:
    name: Sysmon64
  register: sysmon_service
  ignore_errors: true

- name: Create Sysmon staging directory
  ansible.windows.win_file:
    path: C:\Windows\Temp\sysmon_install
    state: directory

- name: Download Sysmon zip from Sysinternals
  ansible.windows.win_get_url:
    url: https://download.sysinternals.com/files/Sysmon.zip
    dest: C:\Windows\Temp\sysmon_install\Sysmon.zip
  when: sysmon_service.failed or sysmon_service.state is not defined

- name: Unzip Sysmon
  ansible.windows.win_shell: |
    Expand-Archive -Path C:\Windows\Temp\sysmon_install\Sysmon.zip `
                   -DestinationPath C:\Windows\Temp\sysmon_install\ `
                   -Force
  when: sysmon_service.failed or sysmon_service.state is not defined

- name: Copy Sysmon config to host
  ansible.windows.win_copy:
    src: sysmonconfig.xml
    dest: C:\Windows\Temp\sysmon_install\sysmonconfig.xml

- name: Install Sysmon (first time)
  ansible.windows.win_shell: |
    C:\Windows\Temp\sysmon_install\Sysmon64.exe -accepteula -i C:\Windows\Temp\sysmon_install\sysmonconfig.xml
  when: sysmon_service.failed or sysmon_service.state is not defined
  register: sysmon_install_result

- name: Update Sysmon config (already installed)
  ansible.windows.win_shell: |
    C:\Windows\Sysmon64.exe -c C:\Windows\Temp\sysmon_install\sysmonconfig.xml
  when:
    - not (sysmon_service.failed or sysmon_service.state is not defined)

- name: Verify Sysmon service is running
  ansible.windows.win_service:
    name: Sysmon64
    state: started
    start_mode: auto

- name: Set Security event log max size (1 GB)
  ansible.windows.win_shell: |
    wevtutil sl Security /ms:1073741824
  changed_when: false

- name: Set Sysmon event log max size (512 MB)
  ansible.windows.win_shell: |
    wevtutil sl "Microsoft-Windows-Sysmon/Operational" /ms:536870912
  changed_when: false

- name: Set PowerShell Operational log max size (256 MB)
  ansible.windows.win_shell: |
    wevtutil sl "Microsoft-Windows-PowerShell/Operational" /ms:268435456
  changed_when: false

- name: Enable PowerShell Script Block Logging
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: 1
    type: dword

- name: Enable command line in process creation events (4688)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
    name: ProcessCreationIncludeCmdLine_Enabled
    data: 1
    type: dword