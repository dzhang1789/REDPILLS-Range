---
- name: Install OpenSSH via scheduled task as SYSTEM
  win_shell: |
    $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -Command Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0"
    $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
    Register-ScheduledTask -TaskName "InstallOpenSSH" -Action $action -Principal $principal -Force
    Start-ScheduledTask -TaskName "InstallOpenSSH"
    $timeout = 120
    $elapsed = 0
    while ((Get-ScheduledTask -TaskName "InstallOpenSSH").State -ne "Ready" -and $elapsed -lt $timeout) {
      Start-Sleep -Seconds 5
      $elapsed += 5
    }
    Unregister-ScheduledTask -TaskName "InstallOpenSSH" -Confirm:$false
  vars:
    ansible_winrm_operation_timeout_sec: 180
    ansible_winrm_read_timeout_sec: 200

- name: Start and enable sshd
  win_service:
    name: sshd
    state: started
    start_mode: auto

- name: Allow SSH through Windows firewall
  win_firewall_rule:
    name: OpenSSH-Server-In-TCP
    localport: 22
    protocol: tcp
    direction: in
    action: allow
    state: present

- name: Create ubuntu user
  win_user:
    name: ubuntu
    password: "castle1234**"
    password_never_expires: yes
    state: present
    groups: Administrators

- name: Set default shell to cmd for SSH
  win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: C:\Windows\System32\cmd.exe
    type: string
    state: present